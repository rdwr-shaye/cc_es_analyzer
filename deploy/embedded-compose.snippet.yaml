# Service definition for the CC's monitoring compose file.
#
#   /opt/radware/storage/dc_config/kvision-infra-monitoring/docker-compose.yaml
#   (that path is a symlink to /var/lib/docker/radware-storage/dc_config/…,
#    so the two paths people quote are the same file)
#
# NOT applied automatically — this is the reviewed source of what CI/CD should
# render into that file. Conventions below are copied from the services already
# in it rather than invented: the kvision-* logging tag, `restart: always`, an
# image from the internal registry, and a port published on 127.0.0.1 only so
# nginx stays the single ingress.
#
# Two things here are still open and marked TODO: the service name (the rename
# is a Phase 0/1 decision and propagates into the image path, container name and
# logging tag) and the image build number, which CI/CD supplies.

  cc-analyzer:                              # TODO: final service name
    logging:
      options:
        tag: "kvision-cc-analyzer"          # TODO: track the rename
    # kvision services come from :18441; :17111 is the third-party mirror
    # (prometheus, grafana, …), so ours belongs on 18441.
    image: reg.radware.com:18441/kvision/kvision_cc_analyzer/dev:1
    container_name: cc-analyzer
    restart: always
    environment:
      # THE line that matters for security review. Without it the app falls
      # back to the "standalone" profile — the remote tool, which carries every
      # capability — and would register the data-fabricating endpoints.
      # See core/policy.py.
      - "ANALYZER_PROFILE=embedded"
      - "ES_HOST=kvision-infra-efk"
      - "ES_PORT=9200"
    volumes:
      # Read-only, and only the properties directory: this is where an
      # entitled operator drops cc_analyzer.properties to unlock the lab
      # capabilities. Read-only means the app can never create its own unlock.
      - "/opt/radware/mgt-server/properties:/opt/radware/mgt-server/properties:ro"
      # Archives survive container rebuilds.
      - "/opt/radware/storage/data/cc-analyzer/exports:/app/exports"
      # The appliance's own `mysql` wrapper, read-only. It is where the CC
      # states which account reaches MariaDB, so reading it means a CC that
      # changes that account is followed without rebuilding this image
      # (modules/maria/credentials.py). One file, not the directory: nothing
      # else in /usr/local/bin is ours to see.
      - "/usr/local/bin/mysql:/usr/local/bin/mysql:ro"
      # The System dashboard's window onto the host. This container has no
      # docker socket and no view of the host filesystem — deliberately — so the
      # container-health, disk-usage and table-integrity checks are asked for
      # through this directory and answered by deploy/host_agent.py, running as
      # root on the CC. Read-write because the request files are written from
      # this side.
      #
      # Worth being precise about what the mount grants, since it is the one
      # new privilege this feature asks for: the ability to place a JSON file
      # naming ONE OF FIVE read-only operations. The agent validates the name
      # and every argument against its own allowlist, which lives on the host
      # and is not in this image. It is not a command channel, and mounting the
      # docker socket instead — the obvious alternative — would have handed the
      # container root on the appliance.
      #
      # Without the agent installed, the app reports those three checks as
      # "unknown" and says so on screen. It does not fail, and it does not
      # report health it could not verify.
      - "/opt/radware/storage/data/cc-admin/hostexec:/app/.hostexec"
    # Bound to loopback like every other service here — reached through nginx,
    # never exposed on the appliance's external interface directly.
    ports:
      - "127.0.0.1:8801:8000"
