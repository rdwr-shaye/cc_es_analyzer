# >>> cc_admin path (managed) >>>
# CC Admin — published on the CC's EXISTING 443 listener, so it costs the
# customer no new port and no firewall rule. Included only from the 443 server
# block in nginx.conf, alongside hosts/vision.conf and hosts/alteon.conf.
#
# Upstream is the container name on the shared `vision` network, so nothing is
# published on the host at all. NOTE: nginx resolves a literal hostname once at
# config load, so if the cc-admin container is RECREATED (and gets a new IP)
# nginx needs a reload. The production version should use a resolver plus a
# variable so the name is re-resolved per request.
location = /cc_admin { return 301 $scheme://$http_host/cc_admin/; }

location /cc_admin/ {
    client_max_body_size 50m;          # large query bodies / bulk ops
    rewrite ^/cc_admin/?(.*)$ /$1 break;
    proxy_pass http://cc-admin:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;               # stream exports without buffering
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
