# CC Admin — path-based location block.
#
# Unlike deploy/nginx/cc-analyzer.conf (an isolated name-based vhost that never
# touches the proxy's own server blocks), this snippet is INSERTED into the
# existing `server_name _;` block(s) by deploy/setup_nginx_path.py, so the app
# becomes reachable at /__CC_PATH__/ on the same IP/hostname — and, critically,
# on the SAME PORT — the proxy already answers on. On a CyberController that is
# 443, which is the whole point: publishing here costs the customer no new port
# and no firewall rule. The path is substituted by setup_nginx_path.py.
#
# The frontend (frontend/static/js/app.js, APP_BASE) already derives its base
# path from window.location, so it works correctly whether served at "/",
# "/__CC_PATH__/", or a name-based vhost — no app changes needed here.

    location = /__CC_PATH__ { return 301 $scheme://$http_host/__CC_PATH__/; }

    location /__CC_PATH__/ {
        client_max_body_size 50m;          # allow large query bodies / bulk ops
        rewrite ^/__CC_PATH__/?(.*)$ /$1 break;
        # __CC_UPSTREAM__ / __CC_SCHEME__ are substituted by setup_nginx_path.py.
        # Upstream = an address the PROXY CONTAINER can actually reach (its docker
        # gateway → the host's published app port, or 127.0.0.1 when the proxy uses
        # host networking); a literal 127.0.0.1 here would resolve to the nginx
        # container itself. Scheme = http, or https when the app runs with
        # SERVICE_SSL=true — the app's cert is self-signed, hence proxy_ssl_verify off.
        proxy_pass __CC_SCHEME__://__CC_UPSTREAM__;
        proxy_ssl_verify off;
        proxy_ssl_server_name off;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;                # stream exports without buffering
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
